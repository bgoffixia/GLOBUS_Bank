name: DUTSTAR verification

on:
  push:
    branches:
      - migration/dutstar-cloudflare
  pull_request:
    branches:
      - migration/dutstar-cloudflare
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dutstar-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/globus-bank run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/globus-bank run build
        env:
          PORT: "24083"
          BASE_PATH: "/"

      - name: Validate Cloudflare Worker bundle and static assets
        run: pnpm dlx wrangler deploy --dry-run --config workers/dutstar-bank-api/wrangler.jsonc

      - name: Publish frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dutstar-frontend-dist
          path: artifacts/globus-bank/dist/public/
          if-no-files-found: error
          retention-days: 7
