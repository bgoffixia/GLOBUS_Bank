name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PORT=24083 BASE_PATH=/ NODE_ENV=production pnpm run build
      - name: Run support messaging and transfer email regression tests
        env:
          SUPABASE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm --filter @workspace/api-server test:support-messaging
      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/globus-bank exec playwright install --with-deps chromium
      - name: Prepare authenticated admin viewport state
        env:
          GLOBUS_VIEWPORT_STORAGE_STATE_BASE64: ${{ secrets.GLOBUS_VIEWPORT_STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$GLOBUS_VIEWPORT_STORAGE_STATE_BASE64" ]; then
            echo "::error::Add the GLOBUS_VIEWPORT_STORAGE_STATE_BASE64 Actions repository secret. See PR #18 setup instructions."
            exit 1
          fi
          STATE_FILE="$RUNNER_TEMP/globus-viewport-storage-state.json"
          printf '%s' "$GLOBUS_VIEWPORT_STORAGE_STATE_BASE64" | base64 --decode > "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          node -e 'const fs=require("node:fs"); const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!Array.isArray(s.cookies) || !Array.isArray(s.origins)) process.exit(2);' "$STATE_FILE"
          echo "GLOBUS_VIEWPORT_STORAGE_STATE=$STATE_FILE" >> "$GITHUB_ENV"
      - name: Run mobile viewport and overflow regression suite
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the VITE_CLERK_PUBLISHABLE_KEY repository Actions variable before running the browser suite."
            exit 1
          fi
          PORT=24083 BASE_PATH=/ NODE_ENV=test VITE_CLERK_PUBLISHABLE_KEY="$VITE_CLERK_PUBLISHABLE_KEY" pnpm --filter @workspace/globus-bank dev > /tmp/globus-vite.log 2>&1 &
          echo $! > /tmp/globus-vite.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:24083/tests/personal-finance-harness.html > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://127.0.0.1:24083/tests/personal-finance-harness.html > /dev/null; then
            cat /tmp/globus-vite.log
            exit 1
          fi
          pnpm --filter @workspace/globus-bank test:viewport
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globus-playwright-diagnostics
          path: |
            artifacts/globus-bank/test-results/
            /tmp/globus-vite.log
          if-no-files-found: ignore
          retention-days: 7
