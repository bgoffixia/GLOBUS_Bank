name: Refresh pnpm lockfile for Cloudflare Workers Builds

on:
  push:
    branches:
      - migration/dutstar-cloudflare
    paths:
      - .github/workflows/refresh-pnpm-lockfile.yml
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/dutstar-cloudflare
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Regenerate lockfile from workspace configuration
        run: pnpm install --no-frozen-lockfile
      - name: Commit regenerated lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the workspace configuration."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Regenerate pnpm lockfile for Cloudflare builds"
          git push origin migration/dutstar-cloudflare
