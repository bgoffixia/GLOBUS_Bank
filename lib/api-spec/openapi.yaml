openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Globus internal ledger API; no external financial provider is connected
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bank
    description: Authenticated wallet and banking operations
  - name: admin
    description: Privileged administrative operations
paths:
  /bank/customer-id/lookup:
    post:
      operationId: lookupCustomerId
      summary: Resolve a Globus Customer ID to its Clerk login identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerIdLookupInput"
      responses:
        "200":
          description: Customer ID resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerIdLookupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many lookup attempts
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bank/me:
    get:
      operationId: getBankProfile
      tags: [bank]
      summary: Get the authenticated user's Globus Bank profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/receipt-preferences:
    get:
      operationId: getBankReceiptPreferences
      tags: [bank]
      summary: Get the authenticated customer's preferred transaction receipt layout
      responses:
        "200":
          description: Current transaction receipt preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankReceiptPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateBankReceiptPreferences
      tags: [bank]
      summary: Update the authenticated customer's preferred transaction receipt layout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankReceiptPreferencesInput" }
      responses:
        "200":
          description: Updated transaction receipt preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankReceiptPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/vault/status:
    get:
      operationId: getBankVaultStatus
      tags: [bank]
      summary: Check whether the customer's private vault is configured
      responses:
        "200":
          description: Vault setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: initializeBankVaultPasscode
      tags: [bank]
      summary: Set the customer's four-digit vault passcode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultPasscodeInput" }
      responses:
        "200":
          description: Vault passcode configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/vault/billing:
    get:
      operationId: getBankVaultBilling
      tags: [bank]
      summary: Read private vault subscription checkout options and access plans
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Subscription checkout provider and access plans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultBilling" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/vault/paystack/initialize:
    post:
      operationId: initializeBankVaultPaystackPayment
      tags: [bank]
      summary: Initialize a server-verified Paystack checkout for a vault plan
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultPaystackInitializeInput" }
      responses:
        "200":
          description: Hosted Paystack checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultPaystackCheckout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bank/vault/paystack/verify:
    post:
      operationId: verifyBankVaultPaystackPayment
      tags: [bank]
      summary: Verify a Paystack checkout and activate the matching vault plan
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultPaystackVerifyInput" }
      responses:
        "200":
          description: Verified payment and current vault subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bank/vault/paystack/manage-renewal:
    post:
      operationId: emailBankVaultPaystackRenewalManagementLink
      tags: [bank]
      summary: Email the customer a Paystack link to manage renewal
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Management link request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                required: [sent]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bank/vault/paystack/webhook:
    post:
      operationId: receiveBankVaultPaystackWebhook
      tags: [bank]
      summary: Receive signed Paystack subscription events
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: { type: string, minLength: 128, maxLength: 128 }
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                required: [received]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bank/vault/transfer-email-alert:
    get:
      operationId: getBankVaultTransferEmailAlert
      tags: [bank]
      summary: Read whether recipient email alerts are enabled for the signed-in customer
      responses:
        "200":
          description: Current transaction email alert toggle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultTransferEmailAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bank/vault/transaction-notes:
    get:
      operationId: listBankVaultTransactionNotes
      tags: [bank]
      summary: List the authenticated member's private transaction notes
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Private transaction notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankVaultTransactionNote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bank/vault/transaction-notes/{transactionId}:
    put:
      operationId: updateBankVaultTransactionNote
      tags: [bank]
      summary: Save a private note for an owned transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultTransactionNoteInput" }
      responses:
        "200":
          description: Saved private transaction note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultTransactionNote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteBankVaultTransactionNote
      tags: [bank]
      summary: Delete a private note for an owned transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Deleted private transaction note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultTransactionNoteDeleteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/vault/email-preferences:
    get:
      operationId: getBankVaultEmailPreferences
      tags: [bank]
      summary: Get private vault transfer alert branding preferences
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Transfer alert branding preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultEmailPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateBankVaultEmailPreferences
      tags: [bank]
      summary: Update private vault transfer alert branding preferences
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultEmailPreferencesInput" }
      responses:
        "200":
          description: Updated transfer alert branding preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultEmailPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bank/vault/receipt-preference:
    get:
      operationId: getBankVaultReceiptPreference
      tags: [bank]
      summary: Get the customer's preferred future transfer receipt layout
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Saved receipt layout preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultReceiptPreference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateBankVaultReceiptPreference
      tags: [bank]
      summary: Save the customer's preferred layout for future transfer receipts
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultReceiptPreferenceInput" }
      responses:
        "200":
          description: Updated future receipt layout preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultReceiptPreference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/vault/unlock:
    post:
      operationId: unlockBankVault
      tags: [bank]
      summary: Authenticate to the private customer vault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultPasscodeInput" }
      responses:
        "200":
          description: Short-lived vault session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /bank/vault/passcode:
    patch:
      operationId: updateBankVaultPasscode
      tags: [bank]
      summary: Change the private vault passcode
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultPasscodeUpdateInput" }
      responses:
        "200":
          description: Vault passcode changed and old sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /bank/vault/wallet-controls:
    get:
      operationId: listBankVaultWalletControls
      tags: [bank]
      summary: List per-wallet private vault controls
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Wallet controls for the authenticated customer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankVaultWalletControl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bank/vault/wallet-controls/{walletId}:
    patch:
      operationId: updateBankVaultWalletControl
      tags: [bank]
      summary: Update one of the customer's wallet controls
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankVaultWalletControlInput" }
      responses:
        "200":
          description: Updated wallet controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankVaultWalletControl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/notifications:
    get:
      operationId: listBankNotifications
      tags: [bank]
      summary: List notifications for the authenticated customer
      responses:
        "200":
          description: Recent account notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BankNotification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: clearBankNotifications
      tags: [bank]
      summary: Delete all notifications belonging to the authenticated customer
      responses:
        "200":
          description: Customer notifications removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankNotificationClearResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bank/notifications/{notificationId}/read:
    patch:
      operationId: markBankNotificationRead
      tags: [bank]
      summary: Mark one of the customer's notifications as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankNotification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/push/preferences:
    get:
      operationId: getBankPushPreferences
      tags: [bank]
      summary: Get the authenticated customer's push alert categories
      responses:
        "200":
          description: Customer push alert preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPushPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateBankPushPreferences
      tags: [bank]
      summary: Update the authenticated customer's push alert categories
      parameters:
        - name: X-Globus-Vault-Session
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankPushPreferencesInput" }
      responses:
        "200":
          description: Updated customer push alert preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPushPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/push/config:
    get:
      operationId: getBankPushConfig
      tags: [bank]
      summary: Get browser push notification setup state
      responses:
        "200":
          description: Webpushr browser site key, if configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPushConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bank/push/subscriptions:
    put:
      operationId: saveBankPushSubscription
      tags: [bank]
      summary: Link the signed-in member to a Webpushr subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankPushSubscriptionInput" }
      responses:
        "200":
          description: Push subscription saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPushSubscriptionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /bank/push/subscriptions/{subscriptionId}:
    delete:
      operationId: deleteBankPushSubscription
      tags: [bank]
      summary: Remove a browser push subscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Push subscription removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPushSubscriptionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bank/me/password-reset/complete:
    post:
      operationId: completeRequiredPasswordReset
      tags: [bank]
      summary: Complete an administrator-required password change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequiredPasswordResetInput"
      responses:
        "200":
          description: Required password change completed, if one was pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteRequiredPasswordResetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bank/dashboard:
    get:
      operationId: getBankDashboard
      tags: [bank]
      summary: Get the user's simulated balances and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bank/personal-finance/records:
    get:
      operationId: listBankPersonalFinanceRecords
      tags: [bank]
      summary: List the signed-in customer's manually maintained finance records
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PersonalFinanceKind" }
        - name: currency
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CurrencyCode" }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Customer-owned finance records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPersonalFinanceRecordPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createBankPersonalFinanceRecord
      tags: [bank]
      summary: Create a manually maintained personal finance record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalFinanceRecordInput" }
      responses:
        "201":
          description: Saved personal finance record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPersonalFinanceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bank/personal-finance/records/{recordId}:
    patch:
      operationId: updateBankPersonalFinanceRecord
      tags: [bank]
      summary: Update one of the signed-in customer's personal finance records
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalFinanceRecordUpdate" }
      responses:
        "200":
          description: Updated personal finance record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPersonalFinanceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBankPersonalFinanceRecord
      tags: [bank]
      summary: Delete one of the signed-in customer's personal finance records
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Personal finance record deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPersonalFinanceRecordDeletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
